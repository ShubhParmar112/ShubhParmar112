<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Shubh Parmar — Machine Learning Engineer, Published Researcher.">
  <title>Shubh Parmar — Machine Learning Engineer, Published Researcher</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="55%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0C1428"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD2FF"/>
      <stop offset="45%" stop-color="#4F9CF9"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F9CF9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4F9CF9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="660" y1="0" x2="773" y2="0">
      <stop offset="0%" stop-color="#4F9CF9" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#43BCD6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F9CF9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4F9CF9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#4F9CF9" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="270" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="270" fill="url(#dots)"/>
    <ellipse cx="210" cy="40" rx="320" ry="190" fill="url(#glowA)"/>
    <ellipse cx="1010" cy="235" rx="330" ry="200" fill="url(#glowB)"/>
    <!-- signal: an audio-style waveform, the raw input -->
    <g fill="url(#bars)">
      <rect x="660" y="124.5" width="5" height="21" rx="2.5"/>
      <rect x="672" y="119" width="5" height="32" rx="2.5"/>
      <rect x="684" y="113" width="5" height="44" rx="2.5"/>
      <rect x="696" y="119" width="5" height="32" rx="2.5"/>
      <rect x="708" y="108.5" width="5" height="53" rx="2.5"/>
      <rect x="720" y="115.5" width="5" height="39" rx="2.5"/>
      <rect x="732" y="105.5" width="5" height="59" rx="2.5"/>
      <rect x="744" y="116.5" width="5" height="37" rx="2.5"/>
      <rect x="756" y="111.5" width="5" height="47" rx="2.5"/>
      <rect x="768" y="121" width="5" height="28" rx="2.5"/>
    </g>
    <!-- the signal travelling into the network -->
    <path d="M787 135 H897" stroke="#2DD4BF" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 5" fill="none"/>
    <g fill="#2DD4BF">
      <circle cx="800" cy="135" r="2.6" opacity="0.7"/>
      <circle cx="835" cy="135" r="2.2" opacity="0.5"/>
      <circle cx="870" cy="135" r="1.9" opacity="0.35"/>
    </g>
    <!-- neural motif -->
    <g stroke="#4F9CF9" stroke-opacity="0.30" stroke-width="1.1" fill="none">
      <path d="M905 65 L1000 135 L905 205 M905 65 L1000 205 M905 205 L1000 65 M1000 135 L1095 65 M1000 135 L1095 135 M1000 135 L1095 205"/>
      <path d="M905 65 L905 205" stroke-opacity="0.14"/>
    </g>
    <g fill="#0E1730" stroke="#2DD4BF" stroke-width="1.6">
      <circle cx="905" cy="65" r="7"/>
      <circle cx="905" cy="205" r="7"/>
      <circle cx="1000" cy="135" r="9"/>
      <circle cx="1095" cy="65" r="6"/>
      <circle cx="1095" cy="135" r="6"/>
      <circle cx="1095" cy="205" r="6"/>
    </g>
    <!-- text -->
    <text x="84" y="118" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-1.2" fill="url(#name)">Shubh Parmar</text>
    <text x="86" y="182" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#C3D3EE">Machine Learning Engineer · Published Researcher</text>
    <text x="86" y="216" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17.5" fill="#7E93B8">B.Tech Integrated, Data Science · NMIMS MPSTME, Mumbai</text>
    <!-- animated sweep -->
    <rect x="86" y="142" width="235" height="2.5" rx="1.25" fill="url(#sweep)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="269" rx="16" fill="none" stroke="#223055" stroke-width="1"/>
</svg>
