    <text x="600" y="56" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-style="italic" font-weight="500" fill="#C3D3EE">&#8220;Transforming data into intelligent solutions.&#8221;</text>
    <text x="600" y="86" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3.5" fill="#6B80A6">THANKS FOR STOPPING BY</text>
