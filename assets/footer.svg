      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#101A33"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F9CF9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F9CF9" stop-opacity="0"/>
